# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan runs once per commit, in the `sonar` job of
# .github/workflows/ci.yml, downstream of both test jobs so that the Python and
# JavaScript coverage reports they produce are both present when it runs.
# It covers BOTH languages in this monorepo -- a second scan would simply
# overwrite the first, since both would publish to the same project key.

sonar.projectKey=SuryaKiran434_flowstate
sonar.organization=suryakiran434

# The two application trees. Deliberately narrower than the repo root: it keeps
# the Airflow DAGs, one-off scripts, Dockerfiles and docs out of the quality
# gate, and it matches exactly what the test suite exercises.
sonar.sources=backend/app,frontend/src
# The frontend keeps its tests beside the code they cover, so that directory is
# declared as test code here and removed from sources in sonar.exclusions below;
# a path indexed as both would fail the scan.
sonar.tests=backend/tests,frontend/src/utils/__tests__

# pytest runs as `cd backend && pytest tests/unit --cov=app --cov-report=xml`,
# so the report lands at backend/coverage.xml. Paths inside it are relative to
# backend/, which the importer resolves via the report's own <sources> element.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.12

# Written by `npm run test:coverage` in the Frontend (React) job and carried to
# the scan as an artifact. Both reports have to reach the scanner: SonarCloud
# scores a file it analyses but cannot find in any coverage report as 0%
# covered, not as unmeasured, so an absent report silently zeroes a whole tree
# rather than leaving it unjudged.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage exclusions, and ONLY coverage exclusions -- everything here is still
# analysed for bugs, code smells, security issues and duplication.
#
# These are the frontend files with no test harness: page components and the
# two visualiser/player components, which need a DOM environment and a mocked
# Spotify SDK before they can be rendered at all, plus the app shell and the
# entrypoint. Left in, they would count as 0% covered and fail the gate on a
# number no test in this repository could currently move.
#
# frontend/src/utils is deliberately NOT excluded: auth.js validates a token
# that arrives in a query parameter and ends up in an Authorization header, it
# has a real vitest suite, and that coverage now counts. Delete an entry here
# as soon as the file behind it gets tests.
sonar.coverage.exclusions=frontend/src/App.jsx,frontend/src/main.jsx,frontend/src/pages/**,frontend/src/components/**

# Defensive: none of these sit inside sonar.sources today, but they are the
# directories that would silently balloon the analysis if the source roots were
# ever widened. Note this excludes the model-artefact drop directory
# backend/models/ (gitignored .joblib/.json files written by the classifier
# trainer) and NOT backend/app/models/, which is real SQLAlchemy source.
sonar.exclusions=**/node_modules/**,**/venv/**,**/.venv/**,airflow/logs/**,backend/models/**,data/models/**,mlruns/**,**/dist/**,frontend/coverage/**,frontend/src/**/__tests__/**

sonar.sourceEncoding=UTF-8
