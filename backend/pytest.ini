[pytest]
testpaths = tests
pythonpath = .

# ─── pytest-asyncio ──────────────────────────────────────────────
# auto: every `async def test_*` is collected without an explicit
# @pytest.mark.asyncio marker.
asyncio_mode = auto

# pytest-asyncio >= 0.24 no longer picks a default loop scope implicitly and
# warns (then errors, in 1.x) when these are unset. Both are set to `function`
# — the historical 0.21 behaviour — so every test and async fixture gets its
# own fresh event loop and nothing leaks between tests.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
