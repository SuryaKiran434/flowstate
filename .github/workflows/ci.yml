name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:

  # ─── Backend: Lint + Test ───────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: flowstate
          POSTGRES_PASSWORD: flowstate_test
          POSTGRES_DB: flowstate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SonarCloud scan at the end of this job needs the full history to
          # attribute code to authors and to work out what counts as "new code";
          # a shallow clone breaks both.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app/
          ruff format --check app/

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://flowstate:flowstate_test@localhost:5432/flowstate_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
          SPOTIFY_CLIENT_ID: test_client_id
          SPOTIFY_CLIENT_SECRET: test_client_secret
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: backend/coverage.xml
          flags: backend

      # Handed to the sonar job below. The scan used to run here, because this
      # was the only job where a coverage report existed -- which meant the
      # frontend could never contribute coverage and its whole tree scored 0%.
      - name: Publish backend coverage for the scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 1

  # ─── Frontend: Lint + Build ─────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_SPOTIFY_CLIENT_ID: test_client_id
        run: |
          cd frontend
          npm run build

      - name: Run tests
        run: |
          cd frontend
          npm run test:coverage

      # lcov records each file relative to frontend/ ("SF:src/utils/auth.js"),
      # but SonarCloud resolves those paths against the repository root, where
      # src/ does not exist. Unresolved paths are a warning in the scanner log,
      # not an error, so the failure mode is silent: coverage simply never
      # arrives and the tree scores 0%. Rewrite the prefix once, here, and fail
      # the job if the rewrite matched nothing.
      - name: Make coverage paths repo-relative
        run: |
          cd frontend
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info
          grep -q '^SF:frontend/src/' coverage/lcov.info
          ! grep -q '^SF:src/' coverage/lcov.info

      - name: Publish frontend coverage for the scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # ─── SonarCloud: one scan for the whole monorepo ─────────────────
  #
  # A job of its own, downstream of both test jobs, because the scan needs
  # something each of them produces. It previously lived inside the backend job,
  # which is where backend/coverage.xml is written -- but frontend/coverage was
  # in a different workspace and so never reached the scanner. Sonar scores a
  # source file it analyses but cannot find in any coverage report as 0%
  # covered rather than as unmeasured, so the whole of frontend/src counted as
  # uncovered and no frontend test could ever change that number.
  #
  # Still one scan, not two: both trees publish to the same project key, so a
  # second scan would simply overwrite the first.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Analysis is advisory, not a gate: a SonarCloud outage or a scanner hiccup
    # must not fail a required check.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to decide which lines are new.
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage

      # A missing report is not a neutral outcome -- it silently zeroes a whole
      # tree's coverage and fails the gate on a number no test could move. Fail
      # loudly here instead, where the run log names the file.
      - name: Verify both reports arrived
        run: |
          test -s backend/coverage.xml
          test -s frontend/coverage/lcov.info

      # Configuration lives in sonar-project.properties at the repo root.
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── Docker: Build check ────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build -t flowstate-backend ./backend

      - name: Build frontend image
        run: docker build -t flowstate-frontend ./frontend
