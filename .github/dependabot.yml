# Dependabot: grouping + auto-merge
#
# Each ecosystem below opens ONE grouped PR per week covering its minor and
# patch updates, rather than one PR per dependency. Majors are kept OUT of the
# groups, so they arrive as their own PRs.
#
# The docker blocks are the exception: they group PATCH only. A base image tag's
# "major" is the product major, so python:3.12-slim -> 3.14-slim is a whole
# runtime jump that Dependabot still calls a minor. Those come as their own PR
# and the workflow declines to auto-merge them.
#
# That split is exactly what .github/workflows/dependabot-auto-merge.yml keys
# on: a grouped minor/patch PR merges itself once the required checks pass, a
# major waits for a human. fetch-metadata reports the HIGHEST bump in a PR, so
# excluding majors from the groups is what stops one breaking change from
# either riding along unseen or stalling an entire batch.

# Dependabot configuration — Flowstate
#
# Ecosystems mirror what actually lives in this repo:
#   pip            → backend/requirements.txt
#   npm            → frontend/package.json + package-lock.json
#   docker         → backend/Dockerfile, frontend/Dockerfile, airflow/Dockerfile
#   github-actions → .github/workflows/*.yml
#
# open-pull-requests-limit is capped at 5 per ecosystem so a weekly run cannot
# flood the queue — main requires the "Backend (Python)", "Frontend (React)"
# and "Docker Build" checks to pass on every PR.

version: 2

updates:
  # ─── Backend: Python (backend/requirements.txt) ──────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # scipy >=1.18 requires numpy>=2.0.0 (1.17.1 is the last release that
      # accepts numpy 1.x, at numpy>=1.26.4,<2.7). numpy 1->2 is a MAJOR, so the
      # rule above holds numpy on 1.x -- which makes any group containing both
      # scipy 1.18 and numpy 1.x unsatisfiable, and pip fails the whole batch
      # before a single test runs. That is what blocked PR #49 and its other 11
      # updates. Capping scipy here keeps the batch resolvable; lift this the
      # day numpy 2 is adopted deliberately.
      - dependency-name: "scipy"
        versions: [">=1.18"]
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. Majors are left
      # out so a group can never carry a breaking change (see header).
      pip-backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── Frontend: npm (frontend/package.json) ───────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. Majors are left
      # out so a group can never carry a breaking change (see header).
      npm-frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── Docker base images ──────────────────────────────────────────
  # One entry per directory containing a Dockerfile.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. PATCH ONLY here:
      # a base image tag's "major" is the product major, so python:3.12 -> 3.14
      # reads as a minor while being a whole runtime jump. Docker minors get their
      # own PR and are held back from auto-merge by the workflow.
      docker-backend:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. PATCH ONLY here:
      # a base image tag's "major" is the product major, so python:3.12 -> 3.14
      # reads as a minor while being a whole runtime jump. Docker minors get their
      # own PR and are held back from auto-merge by the workflow.
      docker-frontend:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "docker"
    directory: "/airflow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. PATCH ONLY here:
      # a base image tag's "major" is the product major, so python:3.12 -> 3.14
      # reads as a minor while being a whole runtime jump. Docker minors get their
      # own PR and are held back from auto-merge by the workflow.
      docker-airflow:
        patterns:
          - "*"
        update-types:
          - "patch"

  # ─── GitHub Actions (.github/workflows) ──────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Collapses this ecosystem's weekly updates into ONE PR. Majors are left
      # out so a group can never carry a breaking change (see header).
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Action majors ARE taken: GitHub deprecates old action runtimes
    # (v4/v5 tags now force onto Node 24), so these need to move.